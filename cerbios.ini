; ==============================================================================
; Cerbios Configuration File (cerbios.ini)
; Compatible with Cerbios v2.x and v3.x
; ==============================================================================

[Dash]
DashPath1 = C:\evoxdash.xbe
DashPath2 = C:\default.xbe
DashPath3 = E:\evoxdash.xbe
DashPath4 = E:\default.xbe
DashPath5 = C:\xboxdash.xbe

[DashPath]
DashPath1 = C:\evoxdash.xbe
DashPath2 = C:\default.xbe
DashPath3 = E:\evoxdash.xbe
DashPath4 = E:\default.xbe
DashPath5 = C:\xboxdash.xbe
Path1 = \Device\Harddisk0\Partition2\evoxdash.xbe
Path2 = \Device\Harddisk0\Partition2\default.xbe
Path3 = \Device\Harddisk0\Partition1\evoxdash.xbe
Path4 = \Device\Harddisk0\Partition2\xboxdash.xbe

[General]
CustomBootAnimation = 1

[Video]
ForceProgressive = 0
Force480p = 0
Force720p = 0
ForceWidescreen = 0

[Fan]
FanSpeed = 20

[Audio]
PlayBootSound = 1
